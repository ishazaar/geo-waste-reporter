services:
  - type: web
    name: geo-waste-reporter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true   # find the value in the Render dashboard -> Environment
      - key: TRUST_PROXY
        value: "1"
      # Optional, enables real image classification:
      # - key: GEMINI_API_KEY
      #   sync: false
# NOTE: the free plan's disk is ephemeral - the SQLite DB and uploaded photos reset on every deploy/restart.
